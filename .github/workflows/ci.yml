name: build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # The project's claim is that it builds with Command Line Tools and needs
    # no Xcode. CI should hold that claim honest rather than quietly using the
    # full toolchain a runner happens to have.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The first CI run failed because the runner shipped Swift 6.1 while a
      # dependency needed 6.2. Select the newest toolchain the image has rather
      # than depending on whichever is default this month.
      - name: select the newest available toolchain
        run: |
          ls /Applications | grep -i '^Xcode' || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi

      - name: toolchain
        run: |
          swift --version
          echo "xcode-select: $(xcode-select -p)"

      - name: build
        run: cd app && swift build -c release

      - name: test
        run: cd app && ./.build/release/deskwork-test

      # The core must not gain a UI dependency. That boundary is what keeps a
      # future Linux or Windows front end a UI project rather than a rewrite,
      # and it is only real if something checks.
      - name: core stays Foundation-only
        run: |
          cd app
          if grep -rlE '^import (AppKit|SwiftUI|UIKit|PDFKit|SwiftTerm)' Sources/DeskworkCore/; then
            echo "::error::DeskworkCore imported a UI framework"
            exit 1
          fi
          echo "clean"

      # Nothing from anyone's workspace belongs in this repo. This repo sits
      # beside a workspace holding medical, financial and client files, and the
      # rule separating them has so far been attention. Attention is not a
      # control.
      #
      # Checks TRACKED files only. The first version scanned the working tree
      # after building, so it read .build/checkouts — dependency sources full
      # of absolute runner paths — and failed on someone else's code.
      - name: no private paths committed
        run: |
          hits=$(git ls-files -z '*.swift' '*.toml' '*.md' '*.yml' '*.sh' \
                 | xargs -0 grep -InE '/Users/[a-z]' 2>/dev/null \
                 | grep -v '/Users/<' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::an absolute home path is committed"
            exit 1
          fi
          echo "clean"
