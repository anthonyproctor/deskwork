# Ask first-time contributors to sign the CLA.
#
# Self-hosted rather than cla-assistant.io: signatures land in this repo's own
# branch, so there is no third party holding the record and no service to
# outlive the project. See CLA.md for what is being agreed and why.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record a signature
        if: >
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on a side branch so they never clutter main's history.
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/anthonyproctor/deskwork/blob/main/CLA.md
          allowlist: anthonyproctor,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for this. Before it can be merged, please read
            [CLA.md](https://github.com/anthonyproctor/deskwork/blob/main/CLA.md)
            and, if you agree, reply to this pull request with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed. Thanks, and welcome.'
