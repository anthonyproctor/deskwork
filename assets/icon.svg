<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Project Coldfall">
  <!-- The mark from the wordmark coldfa||: the two L's drawn as pipes, the
       terminal symbol for passing one program's output to the next. Offset so
       it reads as pipes rather than as a pause button. -->
  <rect x="95" y="95" width="834" height="834" rx="188" fill="#18181c"/>
  <rect x="424" y="251" width="87" height="430" rx="44" fill="#6acd63"/>
  <rect x="513" y="343" width="87" height="430" rx="44" fill="#6acd63"/>
</svg>
